         environment:"development" so it can be filtered out of dashboards. -->

      (function () {
        var KEY = "phc_nsELc7hcobhMd2wf3qstga6vBX5KWq6NVvPTVDdYp8Q6";
        var host = location.hostname;
        var isDev =
          host === "twenty-dev.desync.ai" ||
          host.indexOf(".twenty-dev.desync.ai") !== -1;
        var isProd =
          !isDev &&
          (host === "twenty.desync.ai" ||
            host.indexOf(".twenty.desync.ai") !== -1);
        if ((isProd || isDev) && KEY.indexOf("phc_") === 0) {
          var environment = isProd ? "production" : "development";
          posthog.init(KEY, {
            api_host: "https://e.desync.ai",
            ui_host: "https://us.posthog.com",
            capture_pageview: "history_change",
            capture_pageleave: true,
            person_profiles: "identified_only",
          });
          // product separates Twenty-CRM from the web_app / Gabriel CRM; exposed
          // as a fn so a future posthog.reset() (on sign-out) can re-register.
          window.__phRegister = function () {
            if (window.posthog)
              window.posthog.register({
                product: "twenty-crm",
                environment: environment,
              });
          };
          window.__phRegister();

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #111e1a;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #f3efe7;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
