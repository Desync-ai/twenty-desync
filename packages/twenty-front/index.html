<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/desync-favicon-32.png"
      data-rh="true"
    />
    <link rel="icon" type="image/png" sizes="512x512" href="/desync-logo.png" />
    <link rel="apple-touch-icon" href="/desync-apple-touch.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#0E3D41" />
    <meta name="description" content="Desync CRM" />
    <meta property="og:image" content="/desync-logo.png" />
    <meta property="og:description" content="Desync CRM" />
    <meta property="og:title" content="Desync CRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/desync-logo.png" />
    <meta name="twitter:description" content="Desync CRM" />
    <meta name="twitter:title" content="Desync CRM" />
    <title>Desync CRM</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #111e1a;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #f3efe7;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
