name: CI Shared

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .github/workflows/ci-shared.yaml
        .github/actions/**
        package.json
        yarn.lock
        packages/twenty-shared/**
  shared-test:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    strategy:
      matrix:
        task: [lint, typecheck, test]
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      # Explicit project rather than `nx affected` over tag:scope:shared
      # (which also holds twenty-ui, covered by CI UI, and the lint rules).
      - name: Run ${{ matrix.task }} task
        run: npx nx run twenty-shared:${{ matrix.task }} --configuration=ci --outputStyle=stream
  ci-shared-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, shared-test]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
