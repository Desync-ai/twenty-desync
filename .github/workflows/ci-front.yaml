name: CI Front

# Desync fork: trimmed to lint, typecheck, unit tests, lingui and the
# production build, all on standard (free) runners. Storybook build/test/
# screenshot jobs fed upstream's Argos visual regression and needed the paid
# ubuntu-latest-8-cores runner; see .github/DESYNC-CI.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .github/workflows/ci-front.yaml
        .github/actions/**
        package.json
        yarn.lock
        packages/twenty-front/**
        packages/twenty-front-component-renderer/**
        packages/twenty-ui/**
        packages/twenty-shared/**
        packages/twenty-sdk/**
        !packages/twenty-sdk/package.json
  front-task:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      TASK_CACHE_KEY: front-task-${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, lingui:extract, lingui:compile]
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Restore ${{ matrix.task }} cache
        id: restore-task-cache
        uses: ./.github/actions/restore-cache
        with:
          key: ${{ env.TASK_CACHE_KEY }}
      # run-many over the whole frontend scope rather than `nx affected` (no
      # green baseline on the fork; a full run is what makes green meaningful).
      - name: Reset .env
        run: npx nx run-many --outputStyle=stream -t reset:env --projects=tag:scope:frontend
      - name: Run ${{ matrix.task }} task
        id: run-task
        # TODO(desync): quarantined pre-existing debt in Desync front code (lint 22,
        # typecheck 31: untyped Apollo hooks in desync-onboarding/billing). Remove
        # continue-on-error once fixed; the step still reports its errors.
        continue-on-error: ${{ matrix.task == 'lint' || matrix.task == 'typecheck' }}
        run: npx nx run-many --nxBail --outputStyle=stream --configuration=ci -t ${{ matrix.task }} --parallel=3 --projects=tag:scope:frontend
      - name: Flag quarantined failure
        if: steps.run-task.outcome == 'failure'
        run: echo "::warning::front ${{ matrix.task }} failed (quarantined, see .github/DESYNC-CI.md)"
      - name: Save ${{ matrix.task }} cache
        uses: ./.github/actions/save-cache
        with:
          key: ${{ steps.restore-task-cache.outputs.cache-primary-key }}
  front-build:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Standard public-repo runner: 16 GB RAM.
      NODE_OPTIONS: "--max-old-space-size=12288"
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Front / Write .env
        run: npx nx reset:env twenty-front
      - name: Build frontend
        run: npx nx build twenty-front
      # - name: Upload frontend build artifact
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      #   with:
      #     name: frontend-build
      #     path: packages/twenty-front/build
      #     retention-days: 1
  ci-front-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      [
        changed-files-check,
        front-task,
        front-build,
      ]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
